# dbt model contract — enforced schema + quality tests.
# Adapt column list to your model.

version: 2

models:
  - name: silver_orders
    description: "Cleansed, deduplicated orders. SLA: refreshed every 15 min."
    config:
      contract:
        enforced: true               # blocks schema drift at compile time
    columns:
      - name: order_id
        data_type: string
        constraints:
          - type: not_null
          - type: unique
        tests:
          - not_null
          - unique
      - name: customer_id
        data_type: string
        tests:
          - not_null
          - relationships:
              to: ref('silver_customers')
              field: customer_id
      - name: revenue_cents
        data_type: bigint
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100000000   # 1M dollars; sanity ceiling
      - name: order_date
        data_type: date
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: "'2020-01-01'"
              max_value: "current_date"

    tests:
      - dbt_utils.recency:
          datepart: hour
          field: _updated_at
          interval: 1               # alert if no fresh row in last hour
