# GitHub Actions — lint + test detection rules on PR
# Treat detections as code: PR, review, test, deploy.

name: detection-rules-ci

on:
  pull_request:
    paths:
      - 'rules/**'
      - 'tests/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sigma syntax check
        run: |
          pip install pysigma
          python -m sigma check rules/

  required-fields:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify required metadata fields
        run: ./scripts/verify-rule-metadata.sh rules/
          # Fails if any rule with status=stable lacks owner, runbook, last_reviewed, expected_fp_rate

  test-on-known-tp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replay TP events against rules
        run: ./scripts/replay-tp.sh
          # Each rule has a known TP event in tests/<rule-id>/tp.json
          # Test fails if rule does not fire

  fp-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run against historical (sanitized) telemetry
        run: ./scripts/replay-historical.sh
          # Fails if FP rate > documented threshold for severity:
          #   high: 5%, medium: 15%, low: 30%

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [lint, required-fields, test-on-known-tp, fp-baseline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push to SIEM
        env:
          SIEM_TOKEN: ${{ secrets.SIEM_TOKEN }}
        run: ./scripts/deploy-rules.sh rules/
