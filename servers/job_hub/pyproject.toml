[project]
name = "polish-job-hub-mcp"
version = "0.1.0"
description = "MCP Server for Polish IT Job Boards (JustJoinIT, NoFluffJobs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
